<!doctype html>
<html lang="$lang$">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>$pagetitle$</title>
$if(description)$
    <meta name="description" content="$description$">
$endif$
    <style>
      :root {
        color-scheme: light dark;
        --background: #0d1117;
        --foreground: #e6edf3;
        --muted: #9aa7b2;
        --accent: #2f81f7;
        --card: #161b22;
        --border: #30363d;
        --code-bg: #0b0f14;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 2rem 1rem 4rem;
        background:
          radial-gradient(circle at top left, rgba(47, 129, 247, 0.18), transparent 32rem),
          var(--background);
        color: var(--foreground);
        font: 17px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      main {
        width: min(100%, 820px);
        margin: 0 auto;
      }

      h1, h2, h3 { line-height: 1.25; letter-spacing: -0.02em; }
      h1 { font-size: clamp(2rem, 5vw, 2.75rem); margin: 0 0 1.5rem; }
      h2 {
        font-size: 1.5rem;
        margin: 2.75rem 0 1rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--border);
      }
      h3 { font-size: 1.2rem; margin: 2rem 0 0.75rem; }

      p { margin: 1rem 0; }

      a { color: var(--accent); text-decoration: none; }
      a:hover, a:focus-visible { text-decoration: underline; }

      ol, ul { padding-left: 1.5rem; }
      li { margin: 0.35rem 0; }

      img {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 1.5rem auto;
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      }

      code {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 0.9em;
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.15em 0.4em;
      }

      pre {
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1rem 1.25rem;
        overflow-x: auto;
      }

      pre code { background: none; border: none; padding: 0; }

      strong { color: #f0f6fc; }

      footer {
        margin-top: 3rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
$body$
      <footer>
        <p>Rendered from <code>blog/README.md</code>. The Markdown file is the source of truth.</p>
      </footer>
    </main>
  </body>
</html>
